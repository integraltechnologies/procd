name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          clang-format --version
          clang-format --dry-run --Werror \
            include/*.h src/*.c src/*.h cli/*.c tests/*.c tests/*.h
      - name: warnings-as-errors build
        run: |
          cmake -S . -B build-werror -DCMAKE_C_FLAGS="-Werror"
          cmake --build build-werror

  # PORTABILITY (native, per OS). Green means: the code builds natively on this
  # OS and every test either passed or skipped for a stated, genuine reason
  # (e.g. an unprivileged Linux runner has no cgroup authority). The per-OS
  # native qualification jobs below are the lifecycle evidence. No failure is
  # swallowed. Nothing is cross-compiled.
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build --config Release
      - name: test
        run: ctest --test-dir build --output-on-failure --no-tests=error -C Release

  # WINDOWS NATIVE QUALIFICATION. Green means, on a native Windows runner: the
  # shared lifecycle matrix PASSED every ordinary-topology scenario with
  # witnessed topology and zero survivors (PROCD_REQUIRE_CLEANUP=1); the Job
  # mechanism claims behind ENFORCED held (suspended pre-exec admission, handle
  # non-inheritance, proven emptiness, supervisor loss kills the task); the
  # breakaway negative control was detected; and a real Cargo workload
  # (cmd -> cargo -> rustc / build script / test -> descendants) was cleaned up
  # repeatedly without touching a concurrent Cargo task. Out-of-contract escape
  # probes (parent-process attribute, Job-handle duplication, WMI) are reported
  # separately and never counted as passes.
  windows-native-qualification:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        shell: pwsh
        run: |
          cargo --version
          rustc --version
      - name: configure (MSVC warnings are errors)
        run: cmake -S . -B build-win-qual -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="/WX"
      - name: build native qualification binaries
        run: cmake --build build-win-qual --config Release
      - name: capabilities
        shell: pwsh
        run: '& .\build-win-qual\Release\procd.exe capabilities'
      - name: portable contract unit suite
        shell: pwsh
        run: |
          & .\build-win-qual\Release\procd-unit-test.exe 2>&1 | Tee-Object -FilePath windows-unit.log
          if ($LASTEXITCODE -ne 0) { throw "portable unit suite failed: $LASTEXITCODE" }
      - name: shared lifecycle matrix (every scenario must clean up)
        shell: pwsh
        run: |
          $env:PROCD_REQUIRE_CLEANUP = "1"
          & .\build-win-qual\Release\procd-qualify-test.exe `
            .\build-win-qual\Release\procd-adversary.exe 2>&1 | `
            Tee-Object -FilePath windows-lifecycle.log
          if ($LASTEXITCODE -ne 0) { throw "lifecycle matrix failed: $LASTEXITCODE" }
          if (-not (Select-String -Path windows-lifecycle.log -Quiet `
                  -SimpleMatch "PRACTICAL cleanup qualification: PASS")) {
            throw "practical cleanup verdict missing"
          }
      - name: Windows Job mechanism qualification
        shell: pwsh
        run: |
          & .\build-win-qual\Release\procd-windows-qualification-test.exe `
            .\build-win-qual\Release\procd-adversary.exe 2>&1 | `
            Tee-Object -FilePath windows-qualification.log
          if ($LASTEXITCODE -ne 0) { throw "Windows native qualification failed: $LASTEXITCODE" }
          if (-not (Select-String -Path windows-qualification.log -Quiet `
                  -Pattern "required PASS, .* FAIL")) {
            throw "qualification summary missing"
          }
          if (Select-String -Path windows-qualification.log -Quiet -Pattern "[1-9][0-9]* FAIL") {
            throw "qualification reported a required failure"
          }
      - name: Windows negative control
        shell: pwsh
        run: |
          & .\build-win-qual\Release\procd-negative-control-test.exe `
            .\build-win-qual\Release\procd-adversary.exe `
            .\build-win-qual\Release\procd-negative-control-production-test.exe 2>&1 | `
            Tee-Object -FilePath windows-negative-control.log
          if ($LASTEXITCODE -ne 0) { throw "Windows negative control failed: $LASTEXITCODE" }
          if (-not (Select-String -Path windows-negative-control.log -Quiet `
                  -SimpleMatch "PASS: harness detects breakaway escape; production Job prevents it")) {
            throw "negative-control production comparison missing"
          }
      - name: real Cargo workload lifecycle
        shell: pwsh
        run: |
          $env:PROCD_REQUIRE_CARGO = "1"
          New-Item -ItemType Directory -Force cargo-scratch | Out-Null
          & .\build-win-qual\Release\procd-cargo-test.exe `
            tests\cargo_fixture\Cargo.toml cargo-scratch 2>&1 | `
            Tee-Object -FilePath windows-cargo.log
          if ($LASTEXITCODE -ne 0) { throw "Cargo lifecycle failed: $LASTEXITCODE" }
      - name: full native suite
        run: ctest --test-dir build-win-qual --output-on-failure --no-tests=error -C Release
      - name: publish qualification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-qualification-logs
          path: |
            windows-*.log
          if-no-files-found: warn

  # MACOS NATIVE QUALIFICATION. Green means, on a native macOS runner as an
  # ordinary user: the shared lifecycle matrix PASSED every ordinary-topology
  # scenario (child, grandchild, exec, setsid, setpgid, double-fork, reparent,
  # leader exit, shell background job, env-cleared descendants, churn, timeout,
  # 10 repeated cycles, spawn failure, cross-task isolation) with witnessed
  # topology and zero survivors; the process-group-only negative control leaked
  # detached descendants that production tracking removed; and a real Cargo
  # workload was cleaned up repeatedly without touching a concurrent Cargo task.
  # The reported level stays BEST_EFFORT: membership is procd bookkeeping, not a
  # kernel domain. The documented residual is printed, never counted.
  macos-native-qualification:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          sw_vers
          uname -m
          id
          cargo --version
          rustc --version
      - name: configure + build (warnings are errors)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-Werror"
          cmake --build build
      - name: capabilities
        run: |
          build/procd capabilities | tee caps.txt
          grep -qx "ProcessTreeTermination:     BEST_EFFORT" caps.txt
      - name: shared lifecycle matrix (every scenario must clean up)
        run: |
          PROCD_REQUIRE_CLEANUP=1 build/procd-qualify-test build/procd-adversary | tee macos-lifecycle.log
          grep -q "PRACTICAL cleanup qualification: PASS" macos-lifecycle.log
          echo "--- vacuity guard: a workload that never runs must NOT qualify"
          if PROCD_REQUIRE_CLEANUP=1 build/procd-qualify-test /usr/bin/true; then
            echo "VACUOUS PASS with /usr/bin/true"; exit 1; fi
      - name: tracked-domain regressions
        run: build/procd-macos-tracking-test build/procd-adversary
      - name: negative control (process groups alone leak detached descendants)
        run: build/procd-negative-control-test build/procd-adversary
      - name: real Cargo workload lifecycle
        run: |
          mkdir -p cargo-scratch
          PROCD_REQUIRE_CARGO=1 build/procd-cargo-test tests/cargo_fixture/Cargo.toml cargo-scratch \
            | tee macos-cargo.log
      - name: Cargo negative control (process groups alone leak Cargo descendants)
        run: |
          if PROCD_NC_WEAKEN=1 PROCD_REQUIRE_CARGO=1 build/procd-cargo-test-nc \
               tests/cargo_fixture/Cargo.toml cargo-scratch > macos-cargo-nc.log 2>&1; then
            cat macos-cargo-nc.log; echo "weakened supervision was NOT detected"; exit 1; fi
          grep -E "recorded task processes remain .*daemon" macos-cargo-nc.log
      - name: full native suite
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: publish qualification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-qualification-logs
          path: macos-*.log
          if-no-files-found: warn

  # ENFORCED QUALIFICATION (Linux). The only job whose green means Linux
  # ProcessTreeTermination=ENFORCED (OS-enforced lifecycle grouping; not a
  # sandbox) was demonstrated. A privileged container with a private cgroup
  # namespace gives cgroup v2 + a namespace-root cgroup exposing cgroup.kill.
  # Every prerequisite is asserted up front, and PROCD_REQUIRE_ENFORCED=1 turns
  # any skip (missing prerequisite, unobserved topology precondition,
  # inconclusive negative control) into a failure. The lifecycle suite is then
  # repeated as an ordinary unprivileged user in a delegated cgroup-v2 subtree,
  # the configuration agentctl normally runs in.
  linux-enforced-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ENFORCED qualification in privileged container
        run: |
          cargo --version
          docker run --rm --privileged --cgroupns=private -v "$PWD":/work:ro -w /work \
            -v "${RUSTUP_HOME:-$HOME/.rustup}":/opt/rustup:ro gcc:13 \
            bash -euo pipefail -c '
            apt-get update -qq && apt-get install -y -qq cmake >/dev/null
            # the runner Rust toolchain, used directly (no rustup proxy)
            TC=$(ls -d /opt/rustup/toolchains/*-x86_64-unknown-linux-gnu | head -1)
            export PATH="$TC/bin:$PATH" CARGO_HOME=/tmp/cargo-home
            mkdir -m 1777 -p $CARGO_HOME
            cargo --version
            cmake -S . -B /tmp/build -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/build
            B=/tmp/build

            echo "--- prerequisites (fail, never skip)"
            test "$(id -u)" = 0
            test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
            test -e /sys/fs/cgroup/cgroup.kill
            $B/procd capabilities | tee /tmp/caps
            grep -qx "ProcessTreeTermination:     ENFORCED" /tmp/caps
            grep -qx "SafeRecovery:               ENFORCED" /tmp/caps

            export PROCD_REQUIRE_ENFORCED=1 PROCD_ADV_TTL=10

            echo "--- vacuity guards: a workload that never runs must NOT qualify"
            if $B/procd qualify --require-enforced /bin/true; then
              echo "VACUOUS PASS with /bin/true"; exit 1; fi
            if $B/procd qualify --require-enforced /nonexistent/procd-adversary; then
              echo "VACUOUS PASS with a non-executable adversary"; exit 1; fi

            echo "--- qualification (every lifecycle scenario must PASS)"
            $B/procd qualify --require-enforced $B/procd-adversary
            PROCD_REQUIRE_CLEANUP=1 $B/procd-qualify-test $B/procd-adversary
            echo "--- negative control (process-group termination leaves detached descendants)"
            $B/procd-negative-control-test $B/procd-adversary
            echo "--- recovery"
            $B/procd-recovery-test
            echo "--- real Cargo workload"
            mkdir -p /tmp/cargo-root
            PROCD_REQUIRE_CARGO=1 $B/procd-cargo-test tests/cargo_fixture/Cargo.toml /tmp/cargo-root
            echo "--- Cargo negative control (process-group termination leaks Cargo descendants)"
            if PROCD_NC_WEAKEN=1 PROCD_REQUIRE_CARGO=1 $B/procd-cargo-test-nc \
                 tests/cargo_fixture/Cargo.toml /tmp/cargo-root > /tmp/cargo-nc.log 2>&1; then
              cat /tmp/cargo-nc.log; echo "weakened supervision was NOT detected"; exit 1; fi
            grep -E "recorded task processes remain .*daemon" /tmp/cargo-nc.log

            echo "--- full suite: any skipped test fails this job"
            ctest --test-dir $B --output-on-failure --no-tests=error | tee /tmp/ctest.log
            if grep -Eq "Skipped|did not run|Not Run" /tmp/ctest.log; then
              echo "a test was skipped in the ENFORCED qualification job"; exit 1; fi

            echo "--- lifecycle suite as an ordinary user in a delegated subtree"
            D=/sys/fs/cgroup/agent-deleg
            mkdir $D
            chown 1000:1000 $D $D/cgroup.procs $D/cgroup.subtree_control $D/cgroup.threads
            as_user() { ( echo $BASHPID > $D/cgroup.procs
                exec setpriv --reuid=1000 --regid=1000 --clear-groups --inh-caps=-all \
                  --bounding-set=-all env HOME=/tmp "$@" ); }
            as_user grep -q "^CapEff:.0000000000000000" /proc/self/status
            as_user $B/procd capabilities | tee /tmp/ucaps
            grep -qx "ProcessTreeTermination:     ENFORCED" /tmp/ucaps
            grep -qx "SafeRecovery:               UNSUPPORTED" /tmp/ucaps
            as_user $B/procd qualify --require-enforced $B/procd-adversary
            for t in qualify race identity fd-inherit spawn-fail negative-control; do
              as_user env PROCD_REQUIRE_CLEANUP=1 $B/procd-$t-test $B/procd-adversary
            done
            mkdir -m 0777 /tmp/cargo-user
            as_user env PROCD_REQUIRE_CARGO=1 $B/procd-cargo-test \
              tests/cargo_fixture/Cargo.toml /tmp/cargo-user
          '
